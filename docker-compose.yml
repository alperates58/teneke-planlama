version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: teneke-planlama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teneke_planlama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      TZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teneke_planlama"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "project=teneke-planlama"
      - "phase=faz-2"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teneke-planlama-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=Teneke Planlama
      - APP_ENV=local_demo
      - TZ=Europe/Istanbul
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/teneke_planlama
      - ERP_SQL_HOST=${ERP_SQL_HOST:-host.docker.internal}
      - ERP_SQL_PORT=${ERP_SQL_PORT:-11433}
      - ERP_SQL_DB=${ERP_SQL_DB:-AA_LIDER}
      - ERP_SQL_USER=${ERP_SQL_USER:-planlama}
      - ERP_SQL_PASSWORD=${ERP_SQL_PASSWORD:-}
      - ERP_PLAN_SOURCE_TABLE=${ERP_PLAN_SOURCE_TABLE:-MikroDesktop_LIDER26.dbo.alper_tenekeuretim}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./public:/app/public
      - ./migrations:/app/migrations
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "project=teneke-planlama"
      - "phase=faz-2"

volumes:
  pgdata:
